spring.application.name=HOLA

# ===== Database (Neon) =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ===== Admin Security =====
HOLA.admin.password-hash=${ADMIN_PASSWORD_HASH}

# ===== JWT =====
HOLA.jwt.secret=${JWT_SECRET}
HOLA.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Cloudinary =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===== CORS (frontend origin) =====
HOLA.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

server.port=${PORT:8080}